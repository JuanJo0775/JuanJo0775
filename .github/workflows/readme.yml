name: readme

# Regenera la tabla de proyectos leyendo los repos desde la API de GitHub,
# para que la descripcion y el demo de cada uno salgan del repo real y no
# de texto copiado dentro del README.

on:
  schedule:
    - cron: "17 6 * * *"        # diario, 06:17 UTC
  push:
    paths:
      - "data/profile.json"
      - "templates/**"
      - "scripts/build_readme.py"
      - ".github/workflows/readme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ambos scripts usan solo la libreria estandar: nada que instalar
      - name: Generar README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_readme.py

      # el scramble no depende de datos: solo se regenera si cambian
      # las frases en data/profile.json
      - name: Generar SVG animados
        run: python scripts/build_svg.py

      - name: Publicar si cambio
        run: |
          if [ -z "$(git status --porcelain README.md assets)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "readme: actualizar contribuciones y datos de repos [skip ci]"
          git push
